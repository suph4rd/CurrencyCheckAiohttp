name: currencycheckaiohttp

services:
  project:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file:
      - env/docker_settings.env
    command: > 
      sh -c "alembic -c app/db/alembic.ini upgrade head &&
             exec gunicorn app.server:current_app --bind 0.0.0.0:7777 --worker-class aiohttp.GunicornWebWorker --workers 4"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14.1-alpine
    env_file:
      - env/docker_settings.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - '54321:5432'
    volumes:
      - db:/var/lib/postgresql/data

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "99:80"
    depends_on:
      - project
    restart: always


volumes:
  db:
